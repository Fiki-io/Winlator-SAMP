name: Build Winlator SA-MP APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install NDK and CMake
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Build APK with Gradle
        run: |
          cd app
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK to GoFile
        id: upload_gofile
        run: |
          python3 -c "
          import urllib.request, json, subprocess, glob, os

          apks = glob.glob('app/app/build/outputs/apk/debug/*.apk')
          if not apks:
              print('No APK found!')
              exit(1)

          apk_path = apks[0]
          print(f'Uploading {apk_path} to GoFile...')

          res = urllib.request.urlopen('https://api.gofile.io/servers').read()
          server = json.loads(res)['data']['servers'][0]['name']
          print(f'Target server: {server}')

          cmd = f'curl -s -F \"file=@{apk_path}\" https://{server}.gofile.io/contents/uploadfile'
          p = subprocess.run(cmd, shell=True, capture_output=True, text=True)
          data = json.loads(p.stdout)

          if data.get('status') == 'ok':
              download_page = data['data']['downloadPage']
              print('\n=============================================')
              print(f'🎉 GOFILE DOWNLOAD LINK: {download_page}')
              print('=============================================\n')
              summary_file = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_file:
                  with open(summary_file, 'a') as f:
                      f.write(f'# 📥 Winlator SA-MP APK Download\n\n**Direct GoFile Link:** [{download_page}]({download_page})\n')
          else:
              print('GoFile upload failed:', p.stdout)
          "

      - name: Upload APK Artifact (GitHub Backup)
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-SAMP-Debug-APK
          path: app/app/build/outputs/apk/debug/*.apk
